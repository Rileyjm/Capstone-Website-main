<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - DogDecode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/shared.css" rel="stylesheet">
    <link href="css/login.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🐾 DogDecode</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navMenu">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="Profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="docs.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Sign In</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">🐾</div>
            <p class="login-title">Welcome back</p>
            <p class="login-subtitle">Sign in to your DogDecode account</p>

            <div class="login-error" id="login-error">
                Incorrect email or password. Please try again.
            </div>

            <form id="login-form" onsubmit="handleLogin(event)" novalidate>
                <label class="form-label-custom" for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    class="form-control-custom"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <label class="form-label-custom" for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    class="form-control-custom"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
                <a href="#" class="forgot-link">Forgot password?</a>

                <button type="submit" class="btn-login">Sign In</button>
            </form>

            <div class="divider">or</div>

            <div class="signup-row">
                Don't have an account? <a href="register.html">Create one</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            if (!email || !password) {
                document.getElementById('login-error').style.display = 'block';
                return;
            }

            // Placeholder: replace with real auth logic
            document.getElementById('login-error').style.display = 'block';
        }
    </script>
</body>
</html>
